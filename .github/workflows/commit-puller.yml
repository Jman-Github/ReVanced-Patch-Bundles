name: Commit puller

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Patch bundle updater"]
    types:
      - completed

jobs:
  get-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from triggering run
        if: ${{ github.event_name == 'workflow_run' }}
        id: download_artifact
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          run_id: ${{ github.event.workflow_run.id }}
          name: changed_files
          path: ReVanced-Patch-Bundles
          if_no_artifact_found: ignore

      - name: Verify artifact presence
        if: ${{ github.event_name == 'workflow_run' }}
        id: verify_artifact
        run: |
          if [ -d "ReVanced-Patch-Bundles" ] && [ "$(ls -A ReVanced-Patch-Bundles 2>/dev/null)" ]; then
            echo "has_artifact=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_artifact=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop (no artifact for this run)
        if: ${{ github.event_name == 'workflow_run' && steps.verify_artifact.outputs.has_artifact != 'true' }}
        run: |
          echo "No 'changed_files' artifact found for the triggering run. Exiting without error."
          exit 0

      - name: Try to read explicit commit SHA from artifact
        id: read_sha
        shell: bash
        run: |
          set -euo pipefail
          SHA_FILE="$(find ReVanced-Patch-Bundles -type f -iname 'commit-sha.txt' -print -quit || true)"
          if [ -n "${SHA_FILE:-}" ]; then
            COMMIT_SHA="$(sed -n '1p' "$SHA_FILE" | tr -d '\r' | xargs || true)"
            if [ -n "$COMMIT_SHA" ]; then
              echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
              echo "Found commit-sha.txt with SHA: $COMMIT_SHA"
              exit 0
            fi
          fi
          echo "No explicit commit-sha.txt found (will search by time window)."

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run find_commit.py (strict to triggering run; fail if not found)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: bundles
          ACTOR_LOGIN: github-actions[bot]
          WORKFLOW_RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          WORKFLOW_RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          MAX_AGE_MINUTES: "2"
          STRICT_TO_TRIGGERING_RUN: "true"
          REQUIRED_COMMIT_MSG_PREFIX: ""
          COMMIT_SHA: ${{ steps.read_sha.outputs.commit_sha }}
        run: |
          python scripts/find_commit.py

      - name: Create commit link artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commit-link
          path: commit-link.txt
