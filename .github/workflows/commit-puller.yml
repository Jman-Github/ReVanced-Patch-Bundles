name: Commit puller

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Patch bundle updater"]
    types:
      - completed

jobs:
  get-artifact:
    concurrency:
      group: commit-puller-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Locate patch bundle artifact
        id: locate_artifact
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run && context.payload.workflow_run.id;
            if (!runId) {
              core.setOutput('artifact_found', 'false');
              return;
            }
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100
            });
            const artifact = response.data.artifacts.find(item => item.name === 'changed_files' && !item.expired);
            if (!artifact) {
              core.setOutput('artifact_found', 'false');
              return;
            }
            core.setOutput('artifact_found', 'true');
            core.setOutput('artifact_id', artifact.id.toString());

      - name: Cancel when artifact missing
        if: steps.locate_artifact.outputs.artifact_found != 'true'
        run: |
          echo "No artifact found. Cancelling workflow."
          exit 0

      - name: Download patch bundle artifact
        if: steps.locate_artifact.outputs.artifact_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.locate_artifact.outputs.artifact_id }}
        run: |
          mkdir -p ReVanced-Patch-Bundles
          curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o ReVanced-Patch-Bundles/changed_files.zip
          if [ ! -s ReVanced-Patch-Bundles/changed_files.zip ]; then
            echo "Artifact download failed."
            exit 1
          fi

      - name: Install dependencies
        if: steps.locate_artifact.outputs.artifact_found == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Checkout repository
        if: steps.locate_artifact.outputs.artifact_found == 'true'
        uses: actions/checkout@main

      - name: Download processed commits artifact
        if: steps.locate_artifact.outputs.artifact_found == 'true'
        id: download_commit_state
        uses: benday-inc/download-latest-artifact@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository_owner: 'Jman-Github'
          repository_name: 'ReVanced-Patch-Bundles'
          workflow_name: 'Commit puller'
          branch_name: 'bundles'
          artifact_name: 'commit-puller-state'
          download_path: 'ReVanced-Patch-Bundles'
          download_filename: 'commit-puller-state.zip'
        continue-on-error: true

      - name: Prepare commit state
        if: steps.locate_artifact.outputs.artifact_found == 'true'
        run: |
          mkdir -p commit_state
          if [ -f ReVanced-Patch-Bundles/commit-puller-state.zip ]; then
            unzip -o ReVanced-Patch-Bundles/commit-puller-state.zip -d .
          fi

      - name: Run find_commit.py script
        if: steps.locate_artifact.outputs.artifact_found == 'true'
        env:
          COMMIT_STATE_FILE: commit_state/processed_commits.json
          COMMIT_LINK_FILE: commit-link.txt
          COMMIT_STATE_LIMIT: 256
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python find_commit.py

      - name: Create commit link artifact
        if: steps.locate_artifact.outputs.artifact_found == 'true'
        uses: actions/upload-artifact@main
        with:
          name: commit-link
          path: commit-link.txt

      - name: Upload processed commits artifact
        if: steps.locate_artifact.outputs.artifact_found == 'true'
        uses: actions/upload-artifact@main
        with:
          name: commit-puller-state
          path: commit_state/processed_commits.json
