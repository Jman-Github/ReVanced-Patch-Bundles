name: Patch bundle updater

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write
  packages: read

jobs:
  check_for_updates:
    name: Check for bundle updates
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: bundles

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
        working-directory: ${{ github.workspace }}

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@663fbad34e03c8f12b27f4999ac46e3d90f87eca # v3

      - name: Run generate_bundles.py
        id: run_generate_bundles
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python scripts/generate_bundles.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Grant execute permission
        run: chmod +x ./bundle-parser/gradlew

      - name: Validate package token
        shell: bash
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "::error::GH_PAT secret is missing. Set GH_PAT to a classic PAT with read:packages (and repo if needed), then rerun."
            exit 1
          fi

      - name: Generate patches list
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: ./bundle-parser/gradlew --project-dir bundle-parser "-Pgpr.user=${{ github.repository_owner }}" "-Pgpr.key=${{ secrets.GH_PAT }}" run

      - name: Generate patch list catalog
        run: |
          python scripts/generate_patch_list_catalog.py
          black scripts/generate_patch_list_catalog.py

      - name: Validate generated JSON
        run: python scripts/validate_json.py

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run MyPy
        run: python -m mypy scripts/generate_bundles.py scripts/check_readme.py scripts/find_commit.py scripts/validate_json.py

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit new files
        run: |
          git add '*.json' patch-bundles/PATCH-LIST-CATALOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit. Exiting..."
            echo "has_changes=false" >> $GITHUB_ENV
          else
            git commit -m 'feat: `patch-bundles` update'
            echo "has_changes=true" >> $GITHUB_ENV
          fi

      - name: Find commit for changed files
        id: find_commit
        if: env.has_changes == 'true'
        shell: bash
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            changed_files="$(git diff --name-only HEAD~1 HEAD -- '*.json' patch-bundles/PATCH-LIST-CATALOG.md)"
          else
            changed_files="$(git show --name-only --pretty='' HEAD -- '*.json' patch-bundles/PATCH-LIST-CATALOG.md)"
          fi
          if [ -z "$changed_files" ]; then
            echo "changed_files=" >> "$GITHUB_ENV"
          else
            printf "%s\n" "$changed_files" > changed_files.txt
            echo "changed_files=changed_files.txt" >> "$GITHUB_ENV"
          fi

      - name: Build summary of updated bundles
        if: env.has_changes == 'true' && env.changed_files != ''
        run: python scripts/build_updated_bundles.py

      - name: Record commit SHA
        if: env.has_changes == 'true'
        id: record_sha
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          URL="https://github.com/${{ github.repository }}/commit/$SHA"
          {
            echo "sha=$SHA"
            echo "short_sha=$SHORT_SHA"
            echo "url=$URL"
          } > commit_info.txt
          echo "$SHA" > commit_sha.txt
          echo "commit_sha=$SHA" >> "$GITHUB_ENV"
          echo "commit_url=$URL" >> "$GITHUB_ENV"

      - name: Push changes
        if: env.has_changes == 'true'
        uses: ad-m/github-push-action@d91a481090679876dfc4178fef17f286781251df # v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: bundles

      - name: Create artifact of commit SHA
        if: env.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: commit_sha
          path: |
            commit_sha.txt
            commit_info.txt

      - name: Create artifact of changed files
        if: env.has_changes == 'true' && env.changed_files != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: changed_files
          path: changed_files.txt

      - name: Create artifact of updated bundles
        if: env.has_changes == 'true' && env.changed_files != '' && env.has_bundle_updates == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updated_bundles
          path: updated-bundles.txt

      - name: Create artifact of bundle changelog
        if: env.has_changes == 'true' && env.changed_files != '' && env.has_bundle_updates == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle_changelog
          path: bundle-changelog.md
