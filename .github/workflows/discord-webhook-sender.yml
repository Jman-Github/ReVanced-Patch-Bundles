      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: bundles

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Generate catalog
        run: python generate_patch_list_catalog.py

      - name: Auto-format with Black
        run: black generate_patch_list_catalog.py

      - name: Collect changed files
        run: |
          git status --porcelain | awk '{print $2}' | grep -v '^changed_files.txt$' > changed_files.txt
          if [ -s changed_files.txt ]; then
            echo has_changes=true >> $GITHUB_ENV
          else
            echo has_changes=false >> $GITHUB_ENV
          fi

      - name: Commit and push
        if: env.has_changes == 'true'
        run: |
          author_name=$(git log -1 --format='%an')
          author_email=$(git log -1 --format='%ae')
          git config user.name "$author_name"
          git config user.email "$author_email"
          xargs git add < changed_files.txt
          git commit --amend --no-edit
          git push origin bundles --force-with-lease

      - name: Lint
        run: black --check generate_patch_list_catalog.py

      - name: Upload changed files
        if: env.has_changes == 'true'
        uses: actions/upload-artifact@main
        with:
          name: changed_files
          path: changed_files.txt