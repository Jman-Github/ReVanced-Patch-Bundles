name: Webhook sender

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Commit puller"]
    types:
      - completed

jobs:
  webhook_sender:
    name: webhook sender
    runs-on: ubuntu-latest
    steps:
      - name: Require "Commit puller" to have succeeded
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          echo "Triggered by workflow_run:"
          echo "  name='${{ github.event.workflow_run.name }}'"
          echo "  id='${{ github.event.workflow_run.id }}'"
          echo "  conclusion='${{ github.event.workflow_run.conclusion }}'"
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "::error::Commit puller workflow did not succeed (conclusion='${{ github.event.workflow_run.conclusion }}'). Failing this workflow."
            exit 1
          fi

      - name: Download Artifact from Patch bundle updater
        id: download_patch_bundle_updater_artifact
        uses: benday-inc/download-latest-artifact@6cfc43f319ff559266c55b27e17d581dbbd59cf8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository_owner: 'Jman-Github'
          repository_name: 'ReVanced-Patch-Bundles'
          branch_name: 'bundles'
          artifact_name: 'changed_files'
          workflow_name: 'Patch bundle updater'
          download_path: 'ReVanced-Patch-Bundles'
          download_filename: 'changed_files.zip'
        continue-on-error: true

      - name: Download Summary Artifact from Patch bundle updater
        id: download_patch_bundle_summary_artifact
        uses: benday-inc/download-latest-artifact@6cfc43f319ff559266c55b27e17d581dbbd59cf8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository_owner: 'Jman-Github'
          repository_name: 'ReVanced-Patch-Bundles'
          branch_name: 'bundles'
          artifact_name: 'updated_bundles'
          workflow_name: 'Patch bundle updater'
          download_path: 'ReVanced-Patch-Bundles'
          download_filename: 'updated-bundles.zip'
        continue-on-error: true

      - name: Download Artifact from Commit puller
        id: download_commit_puller_artifact
        uses: benday-inc/download-latest-artifact@6cfc43f319ff559266c55b27e17d581dbbd59cf8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository_owner: 'Jman-Github'
          repository_name: 'ReVanced-Patch-Bundles'
          branch_name: 'bundles'
          artifact_name: 'commit-link'
          workflow_name: 'Commit puller'
          download_path: 'ReVanced-Patch-Bundles'
          download_filename: 'commit-link.zip'
        continue-on-error: true

      - name: Create patch bundle updater artifact directory
        run: mkdir -p ReVanced-Patch-Bundles/patch_bundle_updater_artifact

      - name: Create commit puller artifact directory
        run: mkdir -p ReVanced-Patch-Bundles/commit_puller_artifact

      - name: Unzip Patch bundle updater artifact
        if: ${{ steps.download_patch_bundle_updater_artifact.outcome == 'success' }}
        run: unzip -o ReVanced-Patch-Bundles/changed_files.zip -d ReVanced-Patch-Bundles/patch_bundle_updater_artifact

      - name: Unzip Summary artifact
        if: ${{ steps.download_patch_bundle_summary_artifact.outcome == 'success' }}
        run: unzip -o ReVanced-Patch-Bundles/updated-bundles.zip -d ReVanced-Patch-Bundles/patch_bundle_updater_artifact

      - name: Unzip Commit puller artifact
        if: ${{ steps.download_commit_puller_artifact.outcome == 'success' }}
        run: unzip -o ReVanced-Patch-Bundles/commit-link.zip -d ReVanced-Patch-Bundles/commit_puller_artifact

      - name: Debug — list what we have
        run: |
          echo "=== Workspace tree ==="
          ls -R

      - name: Build embed description
        id: set_changes
        run: |
          python3 - <<'PY'
          import os

          def pick_exact(path):
              try:
                  return path if os.path.isfile(path) and os.path.getsize(path) > 0 else None
              except OSError:
                  return None

          def read_trimmed(path):
              if not path:
                  return ''
              try:
                  with open(path, 'r', encoding='utf-8', errors='ignore') as fh:
                      lines = fh.read().splitlines()
                  while lines and not lines[0].strip():
                      lines.pop(0)
                  while lines and not lines[-1].strip():
                      lines.pop()
                  return '\n'.join(lines)
              except OSError:
                  return ''

          def shorten_paths(text):
              lines = text.splitlines()
              adjusted = []
              for line in lines:
                  if not line.strip():
                      adjusted.append('')
                      continue
                  trimmed = line.lstrip()
                  leading = line[: len(line) - len(trimmed)]
                  marker = ''
                  remainder = trimmed
                  if remainder and remainder[0] in '-*•':
                      marker = remainder[0]
                      remainder = remainder[1:]
                      if remainder.startswith(' '):
                          remainder = remainder[1:]
                          prefix = leading + marker + ' '
                      else:
                          prefix = leading + marker
                  else:
                      prefix = leading
                  content = remainder.strip()
                  if '/' in content:
                      content = content.rsplit('/', 1)[-1]
                  adjusted.append(prefix + content)
              while adjusted and adjusted[0] == '':
                  adjusted.pop(0)
              while adjusted and adjusted[-1] == '':
                  adjusted.pop()
              return '\n'.join(adjusted)

          changes_file = pick_exact('ReVanced-Patch-Bundles/patch_bundle_updater_artifact/changed_files.txt')
          summary_file = pick_exact('ReVanced-Patch-Bundles/patch_bundle_updater_artifact/updated-bundles.txt')
          commit_file  = pick_exact('ReVanced-Patch-Bundles/commit_puller_artifact/commit-link.txt')

          changes = read_trimmed(changes_file)
          summary = read_trimmed(summary_file)
          commit  = read_trimmed(commit_file)

          formatted_changes = shorten_paths(changes) if changes else ''
          changes_text = formatted_changes if formatted_changes.strip() else 'N/A'
          summary_text = summary if summary else 'N/A'

          changes_section = f"**Changes:**\n```\n{changes_text}\n```"
          summary_section = f"**Summary:**\n```\n{summary_text}\n```"

          parts = []
          parts.append("Patch-bundle.json file(s) have been successfully updated by the [Patch Bundle Updater Workflow](https://github.com/Jman-Github/ReVanced-Patch-Bundles/actions/workflows/patch-bundle-updater.yml).")
          parts.append(changes_section)
          parts.append(summary_section)
          if commit.strip():
              parts.append(commit.strip())

          embed_description = "\n\n".join(parts)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('embed_description<<EOF\n' + embed_description + '\nEOF\n')

          print(f"::notice::changes file={changes_file or 'none'}")
          print(f"::notice::summary file={summary_file or 'none'}")
          print(f"::notice::commit  file={commit_file  or 'none'} present={'yes' if bool(commit.strip()) else 'no'}")
          PY

      - name: Send Discord Notification
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          wait: true
          content: '||@everyone||'
          embed-title: 'Patch-Bundle.json File(s) Updated'
          embed-description: ${{ steps.set_changes.outputs.embed_description }}
          embed-color: '65280'
          embed-author-name: 'Patch Bundle Updater Workflow'
          embed-author-icon-url: 'https://github.gallerycdn.vsassets.io/extensions/github/vscode-github-actions/0.26.2/1694016984133/Microsoft.VisualStudio.Services.Icons.Default'
          embed-thumbnail-url: 'https://cdn-icons-png.flaticon.com/512/5278/5278658.png'
          username: 'ReVanced-Patch-Bundles'
          avatar-url: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzUECg_ITr7YkE2pYiVdHqTxlg3wLwXKXIQrcxEBKd7Q&s'
