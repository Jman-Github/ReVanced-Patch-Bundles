name: Webhook sender

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Commit puller"]
    types:
      - completed

jobs:
  webhook_sender:
    name: webhook sender
    runs-on: ubuntu-latest
    steps:
      - name: Require "Commit puller" to have succeeded
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          echo "Triggered by workflow_run:"
          echo "  name='${{ github.event.workflow_run.name }}'"
          echo "  id='${{ github.event.workflow_run.id }}'"
          echo "  conclusion='${{ github.event.workflow_run.conclusion }}'"
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "::error::Commit puller workflow did not succeed (conclusion='${{ github.event.workflow_run.conclusion }}'). Failing this workflow."
            exit 1
          fi

      - name: Download Artifact from Patch bundle updater
        id: download_patch_bundle_updater_artifact
        uses: benday-inc/download-latest-artifact@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository_owner: 'Jman-Github'
          repository_name: 'ReVanced-Patch-Bundles'
          branch_name: 'bundles'
          artifact_name: 'changed_files'
          workflow_name: 'Patch bundle updater'
          download_path: 'ReVanced-Patch-Bundles'
          download_filename: 'changed_files.zip'
        continue-on-error: true

      - name: Download Summary Artifact from Patch bundle updater
        id: download_patch_bundle_summary_artifact
        uses: benday-inc/download-latest-artifact@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository_owner: 'Jman-Github'
          repository_name: 'ReVanced-Patch-Bundles'
          branch_name: 'bundles'
          artifact_name: 'updated_bundles'
          workflow_name: 'Patch bundle updater'
          download_path: 'ReVanced-Patch-Bundles'
          download_filename: 'updated-bundles.zip'
        continue-on-error: true

      - name: Download Artifact from Commit puller
        id: download_commit_puller_artifact
        uses: benday-inc/download-latest-artifact@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository_owner: 'Jman-Github'
          repository_name: 'ReVanced-Patch-Bundles'
          branch_name: 'bundles'
          artifact_name: 'commit-link'
          workflow_name: 'Commit puller'
          download_path: 'ReVanced-Patch-Bundles'
          download_filename: 'commit-link.zip'
        continue-on-error: true

      - name: Create patch bundle updater artifact directory
        run: mkdir -p ReVanced-Patch-Bundles/patch_bundle_updater_artifact

      - name: Create commit puller artifact directory
        run: mkdir -p ReVanced-Patch-Bundles/commit_puller_artifact

      - name: Unzip Patch bundle updater artifact
        if: ${{ steps.download_patch_bundle_updater_artifact.outcome == 'success' }}
        run: unzip -o ReVanced-Patch-Bundles/changed_files.zip -d ReVanced-Patch-Bundles/patch_bundle_updater_artifact

      - name: Unzip Summary artifact
        if: ${{ steps.download_patch_bundle_summary_artifact.outcome == 'success' }}
        run: unzip -o ReVanced-Patch-Bundles/updated-bundles.zip -d ReVanced-Patch-Bundles/patch_bundle_updater_artifact

      - name: Unzip Commit puller artifact
        if: ${{ steps.download_commit_puller_artifact.outcome == 'success' }}
        run: unzip -o ReVanced-Patch-Bundles/commit-link.zip -d ReVanced-Patch-Bundles/commit_puller_artifact

      - name: Debug — list what we have
        run: |
          echo "=== Workspace tree ==="
          ls -R

      - name: Set output variables
        id: set_changes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          pick_txt() {
            local prefer="$1"
            local dir="$2"
            if [ -s "$prefer" ]; then
              printf "%s" "$prefer"
              return 0
            fi
            local first
            first="$(printf "%s\n" "$dir"/**/*.txt "$dir"/*.txt 2>/dev/null | head -n1 || true)"
            if [ -n "${first:-}" ] && [ -s "$first" ]; then
              printf "%s" "$first"
              return 0
            fi
            return 1
          }

          read_trimmed() {
            local f="$1"
            [ -s "$f" ] || { printf ""; return 0; }
            awk 'BEGIN{start=0} { if(start==0){ if($0 ~ /[^[:space:]]/){start=1; print $0} } else { print $0 } }' "$f" \
            | awk ' {buf[NR]=$0} END{ i=NR; while(i>0 && buf[i] ~ /^[[:space:]]*$/){i--} for(j=1;j<=i;j++) print buf[j] }'
          }

          CHANGES_FILE="$(pick_txt 'ReVanced-Patch-Bundles/patch_bundle_updater_artifact/changed_files.txt' 'ReVanced-Patch-Bundles/patch_bundle_updater_artifact' || true)"
          SUMMARY_FILE="$(pick_txt 'ReVanced-Patch-Bundles/patch_bundle_updater_artifact/updated-bundles.txt' 'ReVanced-Patch-Bundles/patch_bundle_updater_artifact' || true)"
          COMMIT_FILE="$(pick_txt 'ReVanced-Patch-Bundles/commit_puller_artifact/commit-link.txt' 'ReVanced-Patch-Bundles/commit_puller_artifact' || true)"

          changes_section=""
          summary_section=""
          commit_section=""

          if [ -n "${CHANGES_FILE:-}" ]; then
            changes_content="$(read_trimmed "$CHANGES_FILE")"
            if [ -n "${changes_content:-}" ]; then
              changes_section="**Changes:**\n```\n${changes_content}\n```"
            fi
            echo "::notice::changes bytes=$(printf "%s" "${changes_content:-}" | wc -c), file='${CHANGES_FILE:-none}'"
          else
            echo "::notice::No changes file found"
          fi

          if [ -n "${SUMMARY_FILE:-}" ]; then
            summary_content="$(read_trimmed "$SUMMARY_FILE")"
            if [ -n "${summary_content:-}" ]; then
              summary_section="**Summary:**\n```\n${summary_content}\n```"
            fi
            echo "::notice::summary bytes=$(printf "%s" "${summary_content:-}" | wc -c), file='${SUMMARY_FILE:-none}'"
          else
            echo "::notice::No summary file found"
          fi

          if [ -n "${COMMIT_FILE:-}" ]; then
            commit_link="$(read_trimmed "$COMMIT_FILE")"
            if [ -n "${commit_link:-}" ]; then
              commit_section="${commit_link}"
            fi
            echo "::notice::commit bytes=$(printf "%s" "${commit_link:-}" | wc -c), file='${COMMIT_FILE:-none}'"
          else
            echo "::notice::No commit file found"
          fi

          : "${changes_section:="**Changes:**\n```\n(no changes found)\n```"}"
          : "${summary_section:="**Summary:**\n```\n(no summary found)\n```"}"
          : "${commit_section:="(no commit link found)"}"

          {
            echo 'changes_section<<EOF'
            printf "%s\n" "$changes_section"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          {
            echo 'summary_section<<EOF'
            printf "%s\n" "$summary_section"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          {
            echo 'commit_section<<EOF'
            printf "%s\n" "$commit_section"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord Notification
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          wait: true
          content: '||@everyone||'
          embed-title: 'Patch-Bundle.json File(s) Updated'
          embed-description: |
            Patch-bundle.json file(s) have been successfully updated by the [Patch Bundle Updater Workflow](https://github.com/Jman-Github/ReVanced-Patch-Bundles/actions/workflows/patch-bundle-updater.yml).

            ${{ steps.set_changes.outputs.changes_section }}
            ${{ steps.set_changes.outputs.summary_section }}
            ${{ steps.set_changes.outputs.commit_section }}
          embed-color: '65280'
          embed-author-name: 'Patch Bundle Updater Workflow'
          embed-author-icon-url: 'https://github.gallerycdn.vsassets.io/extensions/github/vscode-github-actions/0.26.2/1694016984133/Microsoft.VisualStudio.Services.Icons.Default'
          embed-thumbnail-url: 'https://cdn-icons-png.flaticon.com/512/5278/5278658.png'
          username: 'ReVanced-Patch-Bundles'
          avatar-url: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzUECg_ITr7YkE2pYiVdHqTxlg3wLwXKXIQrcxEBKd7Q&s'
