name: Webhook sender

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Commit puller"]
    types:
      - completed

jobs:
  webhook_sender:
    name: webhook sender
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact from Patch bundle updater
        id: download_patch_bundle_updater_artifact
        uses: benday-inc/download-latest-artifact@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository_owner: 'Jman-Github'
          repository_name: 'ReVanced-Patch-Bundles'
          branch_name: 'bundles'
          artifact_name: 'changed_files'
          workflow_name: 'Patch bundle updater'
          download_path: 'ReVanced-Patch-Bundles'
          download_filename: 'changed_files.zip'
        continue-on-error: true

      - name: Download Summary Artifact from Patch bundle updater
        id: download_patch_bundle_summary_artifact
        uses: benday-inc/download-latest-artifact@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository_owner: 'Jman-Github'
          repository_name: 'ReVanced-Patch-Bundles'
          branch_name: 'bundles'
          artifact_name: 'updated_bundles'
          workflow_name: 'Patch bundle updater'
          download_path: 'ReVanced-Patch-Bundles'
          download_filename: 'updated-bundles.zip'
        continue-on-error: true

      - name: Download Artifact from Generate patch list catalog
        id: download_patch_list_catalog_artifact
        uses: benday-inc/download-latest-artifact@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository_owner: 'Jman-Github'
          repository_name: 'ReVanced-Patch-Bundles'
          branch_name: 'bundles'
          artifact_name: 'changed_files'
          workflow_name: 'Generate patch list catalog'
          download_path: 'ReVanced-Patch-Bundles'
          download_filename: 'catalog-changed-files.zip'
        continue-on-error: true

      - name: Download Artifact from Commit puller
        id: download_commit_puller_artifact
        uses: benday-inc/download-latest-artifact@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository_owner: 'Jman-Github'
          repository_name: 'ReVanced-Patch-Bundles'
          branch_name: 'bundles'
          artifact_name: 'commit-link'
          workflow_name: 'Commit puller'
          download_path: 'ReVanced-Patch-Bundles'
          download_filename: 'commit-link.zip'
        continue-on-error: true

      - name: Create patch bundle updater artifact directory
        run: mkdir -p ReVanced-Patch-Bundles/patch_bundle_updater_artifact

      - name: Create commit puller artifact directory
        run: mkdir -p ReVanced-Patch-Bundles/commit_puller_artifact

      - name: Create patch list catalog artifact directory
        if: steps.download_patch_list_catalog_artifact.outputs.artifact_downloaded == 'true'
        run: mkdir -p ReVanced-Patch-Bundles/patch_list_catalog_artifact

      - name: Unzip Patch bundle updater artifact
        if: steps.download_patch_bundle_updater_artifact.outputs.artifact_downloaded == 'true'
        run: unzip ReVanced-Patch-Bundles/changed_files.zip -d ReVanced-Patch-Bundles/patch_bundle_updater_artifact

      - name: Unzip Summary artifact
        if: steps.download_patch_bundle_summary_artifact.outputs.artifact_downloaded == 'true'
        run: unzip ReVanced-Patch-Bundles/updated-bundles.zip -d ReVanced-Patch-Bundles/patch_bundle_updater_artifact

      - name: Unzip Commit puller artifact
        if: steps.download_commit_puller_artifact.outputs.artifact_downloaded == 'true'
        run: unzip ReVanced-Patch-Bundles/commit-link.zip -d ReVanced-Patch-Bundles/commit_puller_artifact

      - name: Unzip Generate patch list catalog artifact
        if: steps.download_patch_list_catalog_artifact.outputs.artifact_downloaded == 'true'
        run: unzip ReVanced-Patch-Bundles/catalog-changed-files.zip -d ReVanced-Patch-Bundles/patch_list_catalog_artifact

      - name: Set output variables
        id: set_changes
        run: |
          if [ -f ReVanced-Patch-Bundles/patch_bundle_updater_artifact/changed_files.txt ]; then
            mapfile -t changes_array < ReVanced-Patch-Bundles/patch_bundle_updater_artifact/changed_files.txt
            changes_json="["
            for ((i=0; i<${#changes_array[@]}; i++)); do
              changes_json+="\"${changes_array[$i]}\\n\","
            done
            changes_json="${changes_json%,}]"
          else
            changes_json="[]"
          fi

          if [ -f ReVanced-Patch-Bundles/patch_bundle_updater_artifact/updated-bundles.txt ]; then
            summary=$(cat ReVanced-Patch-Bundles/patch_bundle_updater_artifact/updated-bundles.txt)
          else
            summary="{}"
          fi

          if [ -f ReVanced-Patch-Bundles/commit_puller_artifact/commit-link.txt ]; then
            commit_link=$(cat ReVanced-Patch-Bundles/commit_puller_artifact/commit-link.txt)
          else
            commit_link="No commit link"
          fi

          if [ -f ReVanced-Patch-Bundles/patch_list_catalog_artifact/changed_files.txt ]; then
            mapfile -t catalog_changes_array < ReVanced-Patch-Bundles/patch_list_catalog_artifact/changed_files.txt
            catalog_section='**Catalog Changes:**%0A```%0A'
            for ((i=0; i<${#catalog_changes_array[@]}; i++)); do
              catalog_section+="${catalog_changes_array[$i]}%0A"
            done
            catalog_section+='```'
          else
            catalog_section=''
          fi

          echo "changes_json=${changes_json}" >> $GITHUB_OUTPUT
          echo "summary=${summary}" >> $GITHUB_OUTPUT
          echo "commit_link=${commit_link}" >> $GITHUB_OUTPUT
          echo "catalog_section=${catalog_section}" >> $GITHUB_OUTPUT

      - name: Send Discord Notification
        uses: tsickert/discord-webhook@master
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          content: '||@everyone||'
          embed-title: 'Patch-Bundle.json File(s) Updated'
          embed-description: |
            Patch-bundle.json file(s) have been successfully updated by the [Patch Bundle Updater Workflow](https://github.com/Jman-Github/ReVanced-Patch-Bundles/actions/workflows/patch-bundle-updater.yml).

            **Changes:**
            ```
            ${{ join(fromJson(steps.set_changes.outputs.changes_json), '') }}
            ```
            **Summary:**
            ```
            ${{ steps.set_changes.outputs.summary }}
            ```
            ${{ steps.set_changes.outputs.catalog_section }}
            ${{ steps.set_changes.outputs.commit_link }}
          embed-color: '65280'
          embed-author-name: 'Patch Bundle Updater Workflow'
          embed-author-icon-url: 'https://github.gallerycdn.vsassets.io/extensions/github/vscode-github-actions/0.26.2/1694016984133/Microsoft.VisualStudio.Services.Icons.Default'
          embed-thumbnail-url: 'https://cdn-icons-png.flaticon.com/512/5278/5278658.png'
          username: 'ReVanced-Patch-Bundles'
          avatar-url: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzUECg_ITr7YkE2pYiVdHqTxlg3wLwXKXIQrcxEBKd7Q&s'
