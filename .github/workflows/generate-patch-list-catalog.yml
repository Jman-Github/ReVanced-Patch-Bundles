name: Generate patch list catalog

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Patch bundle updater"]
    types:
      - completed

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: bundles

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Debug patch‑bundles contents
        run: |
          echo "Listing patch‑bundles directory:"
          ls -R patch-bundles
          echo
          for d in patch-bundles/*-patch-bundles; do
            if [ -d "$d" ]; then
              echo "=== $d ==="
              ls -l "$d"
              echo "First few lines of any .json files:"
              head -n5 "$d"/*.json || echo "  (no .json files or they are empty)"
            fi
          done

      - name: Generate catalog
        run: python generate_patch_list_catalog.py

      - name: Auto‑format with Black
        run: |
          black generate_patch_list_catalog.py

      - name: Commit formatted code
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add generate_patch_list_catalog.py
          git commit -m "chore: Black‑format generate_patch_list_catalog.py" || echo "No changes to commit"
          git push origin bundles || echo "Nothing to push"

      - name: Lint
        run: black --check generate_patch_list_catalog.py

      - name: Commit and push catalog
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add patch-bundles/PATCH-LIST-CATALOG.md
          git commit -m "docs: update patch list catalog" patch-bundles/PATCH-LIST-CATALOG.md
          git push origin bundles
