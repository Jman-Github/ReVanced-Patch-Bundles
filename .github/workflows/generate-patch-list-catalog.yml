name: Generate patch list catalog

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Patch bundle updater"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: bundles

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Generate catalog
        run: python generate_patch_list_catalog.py

      - name: Auto-format with Black
        run: black generate_patch_list_catalog.py

      - name: Detect changes
        id: changes
        run: |
            git status --porcelain | awk '{print $2}' | grep -v '^changed_files.txt$' > changed_files.txt || true
            if [ -s changed_files.txt ]; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi

      - name: Configure git user
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Amend bundle commit with catalog
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          xargs -a changed_files.txt git add
          git commit --amend --no-edit
          git push origin HEAD:bundles --force-with-lease

      - name: Lint
        run: black --check generate_patch_list_catalog.py

      - name: Upload changed files
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changed_files
          path: changed_files.txt
