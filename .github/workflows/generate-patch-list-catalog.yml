name: Generate Patch List Catalog

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Patch bundle updater"]
    types:
      - completed

jobs:
  generate:
    if: github.ref == 'refs/heads/feat/create-script-for-reading-json-patch-files'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: bundles

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Generate catalog
        run: python generate_patch_list_catalog.py

      - name: Lint
        run: black --check generate_patch_list_catalog.py

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add patch-bundles/PATCH-LIST-CATALOG.md
          git commit -m "docs: update patch list catalog" patch-bundles/PATCH-LIST-CATALOG.md
          git push origin bundles

