name: Check for compose manager updates

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: bundles

      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Get artifact URL (latest successful run from a branch containing "compose")
        id: get_artifact
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail

          # Fetch latest workflow runs across the repository (no event filter).
          RUNS_JSON=$(curl -sS \
            -H "Authorization: Bearer ${GIT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ReVanced/revanced-manager/actions/runs?per_page=100")

          if [ -z "$RUNS_JSON" ]; then
            echo "Failed to fetch workflow runs."
            exit 1
          fi

          # Select newest COMPLETED+SUCCESS run where branch name contains "compose" (case-insensitive).
          # Match either .head_branch or any PR head ref.
          SELECTOR='
            .workflow_runs
            | map(select(
                (
                  ((.head_branch // "") | test("compose"; "i")) or
                  (((.pull_requests // []) | map((.head.ref // "") | test("compose"; "i")) | any) // false)
                )
                and
                ((.status // "") == "completed")
                and
                ((.conclusion // "") == "success")
              ))
            | sort_by(.created_at) | reverse | .[0]
          '

          RUN_ID=$(jq -r "$SELECTOR | .id // empty" <<<"$RUNS_JSON")
          ARTIFACTS_URL=$(jq -r "$SELECTOR | .artifacts_url // empty" <<<"$RUNS_JSON")

          if [ -z "${RUN_ID}" ] || [ -z "${ARTIFACTS_URL}" ] || [ "${RUN_ID}" = "null" ] || [ "${ARTIFACTS_URL}" = "null" ]; then
            echo "No successful workflow runs found from branches containing 'compose'."
            exit 1
          fi

          # Fetch artifacts for that run
          ARTIFACTS=$(curl -sS \
            -H "Authorization: Bearer ${GIT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${ARTIFACTS_URL}")

          if [ -z "$ARTIFACTS" ]; then
            echo "Failed to fetch artifacts."
            exit 1
          fi

          # Find the artifact named 'revanced-manager'
          ARTIFACT_ID=$(jq -r '.artifacts[]? | select(.name == "revanced-manager") | .id' <<<"$ARTIFACTS" | head -n 1)
          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "Failed to find 'revanced-manager' artifact in the selected run (${RUN_ID})."
            echo "Artifacts payload:"
            echo "$ARTIFACTS" | jq .
            exit 1
          fi

          ARTIFACT_DOWNLOAD_URL="https://github.com/ReVanced/revanced-manager/actions/runs/${RUN_ID}/artifacts/${ARTIFACT_ID}"

          echo "artifact_url=${ARTIFACT_DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_DOWNLOAD_URL: ${ARTIFACT_DOWNLOAD_URL}"

      - name: Check if README needs update
        id: check_readme
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          TARGET_BRANCH: bundles
        run: |
          set -euo pipefail
          python check_readme.py "${{ steps.get_artifact.outputs.artifact_url }}"

      - name: Update README
        if: steps.check_readme.outputs.needs_update == 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          TARGET_BRANCH: bundles
        run: |
          set -euo pipefail
          python update_readme.py "${{ steps.get_artifact.outputs.artifact_url }}"

      - name: Send Discord Notification
        if: steps.check_readme.outputs.needs_update == 'true'
        uses: tsickert/discord-webhook@master
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          content: '||@everyone||'
          embed-title: 'ReVanced Manager Compose Update'
          embed-description: |
            The manager download link has been updated by the [Manager Update Checker Workflow](https://github.com/Jman-Github/ReVanced-Patch-Bundles/actions/workflows/manager-update-checker.yml).

            [Latest Download](${{ steps.get_artifact.outputs.artifact_url }})
          embed-color: '65280'
          embed-author-name: 'Manager Update Checker Workflow'
          embed-author-icon-url: 'https://github.gallerycdn.vsassets.io/extensions/github/vscode-github-actions/0.26.2/1694016984133/Microsoft.VisualStudio.Services.Icons.Default'
          embed-thumbnail-url: 'https://cdn-icons-png.flaticon.com/512/5278/5278658.png'
          username: 'ReVanced-Patch-Bundles'
          avatar-url: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzUECg_ITr7YkE2pYiVdHqTxlg3wLwXKXIQrcxEBKd7Q&s'
