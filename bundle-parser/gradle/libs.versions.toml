[versions]
kotlin = "2.3.10"
morphe-patcher = "1.1.1"
revanced-patcher = "22.0.0"
revanced-library = "4.0.1"
serialization = "1.6.3"
# Tracking https://github.com/google/smali/issues/64.
#noinspection GradleDependency
smali = "3.0.9"
jsr305 = "3.0.2"
asm = "9.7"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
revanced-patcher = { group = "app.revanced", name = "patcher", version.ref = "revanced-patcher" }
revanced-library = { module = "app.revanced:library", version.ref = "revanced-library" }
smali = { module = "com.android.tools.smali:smali", version.ref = "smali" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
